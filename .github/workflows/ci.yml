name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Reproduce (quick subset)
        run: python reproduce.py quick
      - name: Committed tables are unchanged by the reproduction
        # reproduce.py quick rewrites the CSV tables from the core; a diff here
        # means the code no longer produces the numbers the manuscript quotes.
        run: git diff --exit-code -- data/tables
