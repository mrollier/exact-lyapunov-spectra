[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lyapunov"
version = "1.6.0"
description = "Exact Lyapunov spectra of affine cellular automata and the parity rule on networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Michiel Rollier", email = "michiel.rollier@ugent.be" },
    { name = "Jan M. Baetens" },
]
keywords = [
    "cellular automata",
    "Lyapunov spectrum",
    "affine rules",
    "Boolean Jacobian",
    "network automata",
    "reproducibility",
]
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "networkx==3.3",
    "matplotlib==3.9.2",
]

[project.urls]
Repository = "https://github.com/mrollier/exact-lyapunov-spectra"
Changelog = "https://github.com/mrollier/exact-lyapunov-spectra/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest==8.3.3"]
# Executing the two notebooks in notebooks/ (reproduce.py all): pip install -e '.[notebook]'
notebook = ["nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["verification"]
addopts = "-q"
